<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psychology of Learning Flashcards</title>
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#efece5; --text:#1f1d1a; --muted:#6b665d;
  --border:#ddd8cd; --accent:#3b5bdb; --accent-soft:#e3e8fc; --good:#2b8a3e; --good-soft:#e1f3e4;
  --bad:#c92a2a; --bad-soft:#fbe4e4; --shadow:0 6px 24px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171b; --surface:#202228; --surface2:#2a2d35; --text:#ecebe7; --muted:#9c9a94;
    --border:#363943; --accent:#7c94ff; --accent-soft:#2a3150; --good:#5fcf75; --good-soft:#1f3326;
    --bad:#ff7b7b; --bad-soft:#3a2222; --shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16171b; --surface:#202228; --surface2:#2a2d35; --text:#ecebe7; --muted:#9c9a94;
  --border:#363943; --accent:#7c94ff; --accent-soft:#2a3150; --good:#5fcf75; --good-soft:#1f3326;
  --bad:#ff7b7b; --bad-soft:#3a2222; --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.35rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:6px;margin:18px 0 10px;flex-wrap:wrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:4px 10px;border-radius:999px;font-size:.85rem}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:.9rem;color:var(--muted)}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress>div{height:100%;background:var(--accent);transition:width .25s}
/* card */
.scene{perspective:1400px}
.card{position:relative;min-height:340px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);
  border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;overflow:auto}
.back{transform:rotateY(180deg)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-bottom:10px;gap:8px}
.tag{background:var(--surface2);border-radius:6px;padding:1px 8px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px}
.opts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.opts li{border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface2)}
.opts li b{color:var(--muted);margin-right:6px}
.opts li.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opts li.correct b{color:var(--good)}
.opts li.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ans{font-size:1.35rem;font-weight:700;color:var(--good);margin:4px 0 14px}
.qsmall{color:var(--muted);font-size:.95rem;margin:0 0 6px}
.hint{margin-top:auto;padding-top:12px;color:var(--muted);font-size:.8rem;text-align:center}
.note{font-size:.82rem;color:var(--muted);margin-top:10px;font-style:italic}
.controls{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.controls .good{border-color:var(--good);color:var(--good)}
.controls .bad{border-color:var(--bad);color:var(--bad)}
/* quiz */
.quiz{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:22px}
.quiz .opts li{cursor:pointer}
.quiz .opts li:hover{border-color:var(--accent)}
.quiz.done .opts li{cursor:default}
.score{font-weight:600;color:var(--text)}
/* list */
.list .item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.list h2{font-size:1rem;margin:22px 0 8px;color:var(--accent)}
.list .item .a{color:var(--good);font-weight:600;margin-top:4px}
.list .item .q{font-size:1rem;margin:0}
.search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;margin-bottom:8px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.kbd{font-size:.78rem;color:var(--muted);text-align:center;margin-top:14px}
kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);font-size:.75rem}
@media (max-width:560px){.card{min-height:420px}.face{padding:16px}.q{font-size:1.05rem}}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>Psychology of Learning: Flashcards</h1>

    </div>

  <div class="tabs" id="tabs">

    <button data-mode="list">All Q&amp;A list</button>
  </div>

  <div class="chips" id="chips"></div>

  <div id="view"></div>
</div>

{w:11,q:"The central tenet of Bandura's social-cognitive theory is that people seek to develop a sense of ___ over the important events in their lives.",o:["agency","dependency","attachment","emotion"],a:0},
{w:11,q:"___ hypothesis suggests that social processes influence how information is selected, organized, integrated, and retrieved.",o:["activation","cognitive influence","interaction","social cue strength"],a:1},
// ---------- Week 12 (from the SWAYAM page's accepted answers) ----------
{w:12,q:"Sustainability in economic sustainability is ___.",o:["multidimensional","bidimensional","unidimensional","none of the given"],a:2},
{w:12,q:"The term \"sustainable development\" was first mentioned in a book related to the 1972 UN Stockholm conference on ___.",o:["water","poverty","economic crisis","human environment"],a:3},
{w:12,q:"Environmental sustainability focuses on impacts of processes, products and services on ___.",o:["water","biodiversity","human health","all of the given"],a:3},
{w:12,q:"Which of the following does not come under social sustainability?",o:["Labour practices","Revenue generation","Human rights","Business ethics"],a:1},
{w:12,q:"SDG ___ focuses on clean water and sanitation.",o:["1","17","6","3"],a:2},
{w:12,q:"SDG 16 focuses on ___.",o:["No poverty","No hunger","Good health","Peace and justice"],a:3},
{w:12,q:"On 20 October 2020, the Higher Education Sustainability Initiative (HESI) raised the flag of higher education as a driver for sustainable development and inclusive societies on the first day of the ___ 2020.",o:["National Sustainability Meeting","National Teachers Meeting","Global Childrens' Meeting","Global Education Meeting"],a:3},
{w:12,q:"Education is related to all SDGs.",o:["True","False"],a:0},
{w:12,q:"Successful implementation of ESD requires a shift in focus from ___.",o:["teaching to learning","learning to teaching","reading to speaking","knowing to ignoring"],a:0},
{w:12,q:"___ competency is the ability to reflect on one's own role in the local community and (global) society.",o:["collaboration","self-awareness","strategic","normative"],a:1},
];
DATA.forEach((d,i)=>{d.id=i; d.num=DATA.filter((x,j)=>j<i&&x.w===d.w).length+1;});

const L = "ABCD";
const WEEKS = [...new Set(DATA.map(d=>d.w))];
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- per-viewer storage (safe) ----
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const S = {
  mode:"cards", weeks:new Set(WEEKS), order:[], pos:0, flipped:false,
  shuffle:false, onlyAgain:false, marks:load("pol_marks",{}),
  quiz:{answered:{}, right:0, total:0}, search:""
};

// ---- theme ----
(function(){const t=load("pol_theme",null); if(t) document.documentElement.dataset.theme=t;})();
$("#themeBtn").onclick=()=>{
  const cur=document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark";
  document.documentElement.dataset.theme=next; save("pol_theme",next);
};

// ---- deck building ----
function buildDeck(){
  let deck = DATA.filter(d=>S.weeks.has(d.w));
  if (S.onlyAgain && S.mode!=="list") deck = deck.filter(d=>S.marks[d.id]!=="known");
  deck = deck.map(d=>d.id);
  if (S.shuffle && S.mode!=="list"){
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  }
  S.order=deck; S.pos=0; S.flipped=false;
  S.quiz={answered:{},right:0,total:0};
}

// ---- chips ----
function renderChips(){
  const c=$("#chips");
  const all = S.weeks.size===WEEKS.length;
  c.innerHTML = `<button data-w="all" class="${all?"on":""}">All weeks</button>` +
    WEEKS.map(w=>`<button data-w="${w}" class="${!all&&S.weeks.has(w)?"on":""}">Week ${w}</button>`).join("");
  c.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const w=b.dataset.w;
    if (w==="all") S.weeks=new Set(WEEKS);
    else {
      const n=+w;
      if (S.weeks.size===WEEKS.length) S.weeks=new Set([n]);
      else if (S.weeks.has(n)) { S.weeks.delete(n); if(!S.weeks.size) S.weeks=new Set(WEEKS); }
      else S.weeks.add(n);
    }
    buildDeck(); renderChips(); render();
  });
}

// ---- tabs ----
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  S.mode=b.dataset.mode; buildDeck(); render();
});

function optsHTML(d, cls){
  return `<ul class="opts">${d.o.map((o,i)=>`<li data-i="${i}" class="${cls?cls(i):""}"><b>${L[i]}.</b>${esc(o)}</li>`).join("")}</ul>`;
}
function toolbar(extra){
  const known = DATA.filter(d=>S.marks[d.id]==="known").length;
  return `<div class="bar">
    <label><input type="checkbox" id="shuf" ${S.shuffle?"checked":""}> Shuffle</label>
    <label><input type="checkbox" id="again" ${S.onlyAgain?"checked":""}> Hide cards marked "Got it"</label>
    <span style="margin-left:auto">${extra||""} · Known: ${known}/${DATA.length}</span>
  </div>`;
}
function bindToolbar(){
  const sh=$("#shuf"), ag=$("#again");
  if(sh) sh.onchange=()=>{S.shuffle=sh.checked; buildDeck(); render();};
  if(ag) ag.onchange=()=>{S.onlyAgain=ag.checked; buildDeck(); render();};
}

// ---- render ----
function render(){
  if (S.mode==="cards") renderCards();
  else if (S.mode==="quiz") renderQuiz();
  else renderList();
}

function emptyMsg(){
  return `<div class="empty">No cards here. ${S.onlyAgain?`Every card in this selection is marked "Got it". <button id="reset">Reset marks</button>`:""}</div>`;
}

function renderCards(){
  const v=$("#view");
  if(!S.order.length){ v.innerHTML=toolbar()+emptyMsg(); bindToolbar(); bindReset(); return; }
  const d=DATA[S.order[S.pos]];
  const mark=S.marks[d.id];
  v.innerHTML = toolbar(`Card ${S.pos+1} / ${S.order.length}`) + `
  <div class="progress"><div style="width:${(S.pos+1)/S.order.length*100}%"></div></div>
  <div class="scene"><div class="card ${S.flipped?"flipped":""}" id="card">
    <div class="face front">
      <div class="meta"><span class="tag">Week ${d.w} · Q${d.num}</span><span>${mark==="known"?"✓ Got it":mark==="again"?"↻ Review again":""}</span></div>
      <p class="q">${esc(d.q)}</p>
      ${optsHTML(d)}
      <div class="hint">Click card or press Space to reveal the answer</div>
    </div>
    <div class="face back">
      <div class="meta"><span class="tag">Week ${d.w} · Q${d.num}</span><span>Answer</span></div>
      <p class="qsmall">${esc(d.q)}</p>
      <div class="ans">${L[d.a]}. ${esc(d.o[d.a])}</div>
      ${optsHTML(d, i=>i===d.a?"correct":"")}
      ${d.n?`<div class="note">Note: ${esc(d.n)}</div>`:""}
      <div class="hint">Click to flip back</div>
    </div>
  </div></div>
  <div class="controls">
    <button id="prev">← Prev</button>
    <button id="flip" class="primary">Flip</button>
    <button id="bad" class="bad">↻ Again</button>
    <button id="good" class="good">✓ Got it</button>
    <button id="next">Next →</button>
  </div>
  <div class="kbd"><kbd>←</kbd> <kbd>→</kbd> navigate · <kbd>Space</kbd> flip · <kbd>G</kbd> got it · <kbd>A</kbd> again</div>`;
  fitCard();
  bindToolbar();
  $("#card").onclick=flip; $("#flip").onclick=flip;
  $("#prev").onclick=()=>go(-1); $("#next").onclick=()=>go(1);
  $("#good").onclick=()=>markCard("known"); $("#bad").onclick=()=>markCard("again");
}
// size card to the taller face so nothing is clipped
function fitCard(){
  const card=$("#card"); if(!card) return;
  let h=0; card.querySelectorAll(".face").forEach(f=>{f.style.position="relative";h=Math.max(h,f.scrollHeight);f.style.position="";});
  card.style.minHeight=Math.max(h,300)+"px";
}
function flip(){S.flipped=!S.flipped; $("#card").classList.toggle("flipped",S.flipped);}
function go(n){
  if(!S.order.length) return;
  S.pos=(S.pos+n+S.order.length)%S.order.length; S.flipped=false; render();
}
function markCard(m){
  const id=S.order[S.pos]; S.marks[id]=m; save("pol_marks",S.marks);
  if(S.onlyAgain && m==="known"){
    S.order.splice(S.pos,1); if(S.pos>=S.order.length) S.pos=0; S.flipped=false; render();
  } else go(1);
}
function bindReset(){const r=$("#reset"); if(r) r.onclick=()=>{S.marks={}; save("pol_marks",S.marks); buildDeck(); render();};}

function renderQuiz(){
  const v=$("#view");
  if(!S.order.length){ v.innerHTML=toolbar()+emptyMsg(); bindToolbar(); bindReset(); return; }
  if(S.pos>=S.order.length){
    const pct=Math.round(S.quiz.right/S.quiz.total*100);
    const wrong=S.order.filter(id=>S.quiz.answered[id]!==DATA[id].a);
    v.innerHTML = `<div class="quiz"><p class="q">Quiz finished</p>
      <p class="score">Score: ${S.quiz.right} / ${S.quiz.total} (${pct}%)</p>
      ${wrong.length?`<p class="sub">Questions you missed:</p><div class="list">${wrong.map(id=>{const d=DATA[id];
        return `<div class="item"><p class="q">W${d.w} Q${d.num}. ${esc(d.q)}</p><div class="a">${L[d.a]}. ${esc(d.o[d.a])}</div></div>`}).join("")}</div>`:"<p>Perfect score!</p>"}
      <div class="controls"><button class="primary" id="restart">Restart quiz</button>
      ${wrong.length?`<button id="retryWrong">Retry missed only</button>`:""}</div></div>`;
    $("#restart").onclick=()=>{buildDeck(); render();};
    const rw=$("#retryWrong"); if(rw) rw.onclick=()=>{S.order=wrong; S.pos=0; S.quiz={answered:{},right:0,total:0}; render();};
    return;
  }
  const d=DATA[S.order[S.pos]];
  const ans=S.quiz.answered[d.id];
  const done=ans!==undefined;
  v.innerHTML = toolbar(`Question ${S.pos+1} / ${S.order.length} · <span class="score">Score ${S.quiz.right}/${S.quiz.total}</span>`) + `
  <div class="progress"><div style="width:${(S.pos)/S.order.length*100}%"></div></div>
  <div class="quiz ${done?"done":""}">
    <div class="meta"><span class="tag">Week ${d.w} · Q${d.num}</span><span>${done?(ans===d.a?"✓ Correct":"✗ Wrong"):"Pick an answer"}</span></div>
    <p class="q">${esc(d.q)}</p>
    ${optsHTML(d, i=>!done?"":i===d.a?"correct":i===ans?"wrong":"")}
    ${done&&d.n?`<div class="note">Note: ${esc(d.n)}</div>`:""}
    <div class="controls">${done?`<button class="primary" id="qnext">${S.pos+1<S.order.length?"Next →":"See results"}</button>`:""}</div>
  </div>
  <div class="kbd"><kbd>1</kbd>–<kbd>4</kbd> or <kbd>A</kbd>–<kbd>D</kbd> answer · <kbd>Enter</kbd> / <kbd>→</kbd> next</div>`;
  bindToolbar();
  if(!done) v.querySelectorAll(".quiz .opts li").forEach(li=>li.onclick=()=>answer(+li.dataset.i));
  const n=$("#qnext"); if(n) n.onclick=qNext;
}
function answer(i){
  const d=DATA[S.order[S.pos]];
  if(S.quiz.answered[d.id]!==undefined || i>=d.o.length) return;
  S.quiz.answered[d.id]=i; S.quiz.total++; if(i===d.a) S.quiz.right++;
  if(i!==d.a){S.marks[d.id]="again"; save("pol_marks",S.marks);}
  render();
}
function qNext(){
  const d=DATA[S.order[S.pos]]; if(!d||S.quiz.answered[d.id]===undefined) return;
  S.pos++; render();
}

function renderList(){
  const v=$("#view");
  const q=S.search.toLowerCase();
  const items=S.order.map(id=>DATA[id]).filter(d=>!q||(d.q+" "+d.o.join(" ")).toLowerCase().includes(q));
  let html=`<input class="search" id="search" placeholder="Search questions and answers…" value="${esc(S.search)}">
    <div class="bar"><span>${items.length} questions</span><button id="print" style="margin-left:auto">Print</button></div><div class="list">`;
  let lastW=-1;
  items.forEach(d=>{
    if(d.w!==lastW){html+=`<h2>Week ${d.w}</h2>`; lastW=d.w;}
    html+=`<div class="item"><p class="q">${d.num}. ${esc(d.q)}</p><div class="a">→ ${L[d.a]}. ${esc(d.o[d.a])}</div>${d.n?`<div class="note">${esc(d.n)}</div>`:""}</div>`;
  });
  html+= items.length?"</div>":`</div><div class="empty">No matches.</div>`;
  v.innerHTML=html;
  const s=$("#search");
  s.oninput=()=>{S.search=s.value; const p=s.selectionStart; renderList(); const n=$("#search"); n.focus(); n.setSelectionRange(p,p);};
  $("#print").onclick=()=>window.print();
}

// ---- keyboard ----
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  const k=e.key.toLowerCase();
  if(S.mode==="cards"){
    if(k===" "||k==="enter"){e.preventDefault(); if($("#card")) flip();}
    else if(k==="arrowright") go(1);
    else if(k==="arrowleft") go(-1);
    else if(k==="g") markCard("known");
    else if(k==="a") markCard("again");
  } else if(S.mode==="quiz"){
    if("1234".includes(k)&&k) answer(+k-1);
    else if("abcd".includes(k)&&k) answer("abcd".indexOf(k));
    else if(k==="enter"||k==="arrowright"){e.preventDefault(); qNext();}
  }
});
window.addEventListener("resize",fitCard);

buildDeck(); renderChips(); render();
</script>
</body>
</html>
