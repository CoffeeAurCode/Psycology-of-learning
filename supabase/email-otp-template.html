<!--
  Paste this into BOTH of these Supabase email templates
  (Authentication → Emails → Templates):
    1. "Magic link"      — subject: Your Coffee aur Code login code: {{ .Token }}
    2. "Confirm sign up" — subject: Your Coffee aur Code login code: {{ .Token }}
  The app signs people in with the one-time code {{ .Token }}, so the code must be in the email.
-->
<div style="margin:0;padding:32px 16px;background:#f6f0e6;font-family:Arial,Helvetica,sans-serif;color:#17110e">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #e6dac8;border-radius:20px;overflow:hidden">
    <div style="background:#120f0e;padding:22px 24px;text-align:center">
      <div style="font-weight:900;letter-spacing:4px;font-size:20px;color:#f4eadb">COFFEE</div>
      <div style="font-weight:700;letter-spacing:4px;font-size:11px;color:#ef3a42;margin:4px 0">&mdash; AUR &mdash;</div>
      <div style="font-weight:900;letter-spacing:4px;font-size:20px;color:#f4eadb">CODE</div>
    </div>
    <div style="padding:28px 24px;text-align:center">
      <p style="margin:0 0 6px;font-size:16px;font-weight:700">Your login code for Psychology of Learning</p>
      <p style="margin:0 0 20px;font-size:14px;color:#6f6359">Type this code in the app to sign in.</p>
      <div style="display:inline-block;padding:14px 22px;border-radius:14px;background:#120f0e;color:#f4eadb;font-size:32px;font-weight:900;letter-spacing:10px;font-family:'Courier New',monospace">{{ .Token }}</div>
      <p style="margin:20px 0 0;font-size:13px;color:#6f6359">The code expires in 1 hour. If you didn't ask for it, you can ignore this email.</p>
    </div>
  </div>
  <p style="text-align:center;font-size:12px;color:#9c8f82;margin:16px 0 0">Made with &#9749; by Coffee aur Code</p>
</div>
